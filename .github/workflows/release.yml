name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          cd target/release
          7z a ../../valtools-${{ inputs.version }}-x86_64-pc-windows-msvc.zip ./valtools.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: valtools ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: valtools-${{ inputs.version }}-x86_64-pc-windows-msvc.zip
