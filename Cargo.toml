[package]
name = "valtools"
version = "0.2.0"
edition = "2021"
description = "Switch Valorant accounts, view your daily store, and clean cache"
exclude = ["images"]

[dependencies]
base64 = "0.23"
gpui-kit = "0.9.1"
log = "0.4"
open = "5.4"
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "3.5", features = ["json"] }

[build-dependencies]
winresource = "0.1"
