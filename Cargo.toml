[package]
name = "valtools"
version = "0.1.1"
edition = "2021"
description = "A lightweight Valorant toolkit for account switching, shop viewing, and cache cleaning"
exclude = ["images"]

[dependencies]
base64 = "0.23"
futures-util = "0.3"
gpui-kit = "0.9.1"
open = "5.4"
reqwest = { version = "0.13", default-features = false, features = [ # https://docs.rs/crate/reqwest/latest/features
    "charset",      # default
    "http2",        # default
    "system-proxy", # default
    "json",
    "native-tls",
] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
winresource = "0.1"
