[package]
name = "valtools"
version = "0.1.1"
edition = "2021"
description = "A lightweight Valorant toolkit for account switching, shop viewing, and cache cleaning"
exclude = ["images"]

[dependencies]
base64 = "0.23"
gpui-kit = "0.9.1"
open = "5.4"
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "3.5.1", default-features = false, features = [ # https://docs.rs/crate/ureq/3.5.1/features
    "gzip",                  # default
    "json",
    "native-tls-no-default",
    "platform-verifier",
] }

[build-dependencies]
winresource = "0.1"
