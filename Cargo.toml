[package]
name = "valtools"
version = "0.1.1"
edition = "2021"
description = "A lightweight Valorant toolkit for account switching, shop viewing, and cache cleaning"
exclude = ["images"]

[dependencies]
base64 = "0.23"
serde_json = "1"
serde_yaml = "0.9"
slint = "1.17"
ureq = { version = "3", default-features = false, features = [
    "native-tls",
    "platform-verifier",
    "json",
    "gzip",
] }

[build-dependencies]
slint-build = "1.17"
winresource = "0.1"
