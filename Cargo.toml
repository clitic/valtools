[package]
name = "valtools"
version = "0.1.1"
edition = "2021"
description = "A lightweight Valorant toolkit for account switching, shop viewing, and cache cleaning"
exclude = ["images"]

[dependencies]
base64 = "0.23"
futures-util = "0.3"
gpui-kit = "0.9.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
winresource = "0.1"
